$kind: http-request
method: PUT
url: '{{base_url}}/api/lessons/{{lesson_id}}/'
order: 4000
pathVariables:
  - key: lesson_id
    value: '{{lesson_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "course": 1,
      "title": "Обновлённый урок",
      "description": "Новое описание",
      "video_url": "https://youtube.com/watch?v=updated"
    }
